# GeoAirQuality — GitHub Actions (parity with .gitlab-ci.yml)
# ---------------------------------------------------------------------------
# Mirrors the GitLab pipeline so the repo is CI-ready on both platforms:
#   lint → test → integration (PostGIS+Redis) → build+scan → publish → deploy
# Staging auto-deploys on main; production is manual via workflow_dispatch
# gated by the `production` environment (approval required).
# ---------------------------------------------------------------------------
# Required repository secrets/variables:
#   KUBE_CONFIG_STAGING    base64 kubeconfig for staging
#   KUBE_CONFIG_PRODUCTION base64 kubeconfig for production
#   STAGING_NAMESPACE / PRODUCTION_NAMESPACE
# Cloudflare Pages (frontend SPA):
#   CLOUDFLARE_API_TOKEN   API token with Pages:Edit + Account:Read
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare account ID
#   CLOUDFLARE_PAGES_PROJECT (optional, default geoairquality-breathe)
# ---------------------------------------------------------------------------

name: CI

on:
  push:
    branches: [main]
    tags: ["milestone/*"]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_production:
        description: "Deploy to production"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  PYTHON_VERSION: "3.11"
  DATABASE_URL: "postgresql://geoair_user:geoair_pass@localhost:5432/geoairquality"
  REDIS_URL: "redis://localhost:6379/0"

jobs:
  # ------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            data-pipeline/requirements.txt
      - run: pip install black flake8
      - name: Enforced lint (new code)
        run: make lint
      - name: Soft lint (legacy code, non-blocking)
        run: |
          black --check api/main.py api/models.py api/cache.py data-pipeline/ || true
          flake8 api/main.py api/models.py api/cache.py --max-line-length=100 || true

  # ------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            data-pipeline/requirements.txt
      - run: pip install -r api/requirements.txt pytest-cov
      - name: Unit tests + coverage (supported suite)
        run: make test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-report
          path: |
            report.xml
            coverage.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit
          path: report.xml

  # ------------------------------------------------------------------
  # Legacy Dask pipeline tests are KNOWN-FAILING (dask disabled in the
  # project). Reported via continue-on-error — never blocks delivery.
  test-legacy:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r api/requirements.txt -r data-pipeline/requirements.txt
      - name: Legacy Dask pipeline tests (soft gate)
        run: make test-legacy

  # ------------------------------------------------------------------
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_DB: geoairquality
          POSTGRES_USER: geoair_user
          POSTGRES_PASSWORD: geoair_pass
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U geoair_user -d geoairquality"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: pip install -r api/requirements.txt
      - name: Apply migrations against real PostGIS
        run: cd api && alembic upgrade head
      - name: Integration tests
        run: make test-integration
        env:
          RUN_INTEGRATION: "1"

  # ------------------------------------------------------------------
  # Secrets are BLOCKING: gitleaks scans full history on every PR/push.
  # Baseline verified clean (gitleaks v8.23.1, 0 leaks).
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks (blocking)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ------------------------------------------------------------------
  build-and-scan:
    runs-on: ubuntu-latest
    needs: [lint, test, integration]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: api
          file: api/Dockerfile
          push: false
          tags: ghcr.io/${{ github.repository }}/api:${{ github.sha }}
      - name: Build pipeline image
        uses: docker/build-push-action@v6
        with:
          context: data-pipeline
          file: data-pipeline/Dockerfile
          push: false
          tags: ghcr.io/${{ github.repository }}/pipeline:${{ github.sha }}
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/${{ github.repository }}/api:${{ github.sha }}
          format: table
          exit-code: "0" # soft gate — report, don't block
          severity: HIGH,CRITICAL
      - name: Python dependency audit
        run: |
          pip install pip-audit
          pip-audit -r api/requirements.txt -r data-pipeline/requirements.txt || true

  # ------------------------------------------------------------------
  publish:
    runs-on: ubuntu-latest
    needs: [build-and-scan]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/milestone/')
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Publish API image
        uses: docker/build-push-action@v6
        with:
          context: api
          file: api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/api:${{ github.sha }}
            ghcr.io/${{ github.repository }}/api:latest
      - name: Publish pipeline image
        uses: docker/build-push-action@v6
        with:
          context: data-pipeline
          file: data-pipeline/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/pipeline:${{ github.sha }}
            ghcr.io/${{ github.repository }}/pipeline:latest

  # ------------------------------------------------------------------
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [publish]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Configure kubectl
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
      - name: Deploy to staging
        run: |
          NS="${{ vars.STAGING_NAMESPACE }}"
          IMG="ghcr.io/${{ github.repository }}"
          kubectl set image deployment/geoairquality-api api="$IMG/api:${{ github.sha }}" -n "$NS"
          kubectl set image deployment/geoairquality-pipeline pipeline="$IMG/pipeline:${{ github.sha }}" -n "$NS"
          kubectl rollout status deployment/geoairquality-api -n "$NS" --timeout=240s
          kubectl rollout status deployment/geoairquality-pipeline -n "$NS" --timeout=240s

  # ------------------------------------------------------------------
  deploy-production:
    runs-on: ubuntu-latest
    needs: [publish]
    environment: production
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_production
    steps:
      - uses: actions/checkout@v4
      - name: Configure kubectl
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
      - name: Deploy to production
        run: |
          NS="${{ vars.PRODUCTION_NAMESPACE }}"
          IMG="ghcr.io/${{ github.repository }}"
          kubectl set image deployment/geoairquality-api api="$IMG/api:${{ github.sha }}" -n "$NS"
          kubectl set image deployment/geoairquality-pipeline pipeline="$IMG/pipeline:${{ github.sha }}" -n "$NS"
          kubectl rollout status deployment/geoairquality-api -n "$NS" --timeout=300s
          kubectl rollout status deployment/geoairquality-pipeline -n "$NS" --timeout=300s

  # ------------------------------------------------------------------
  # Cloudflare Pages — "Breathe" frontend SPA (static + /api proxy)
  # Deploys on main and milestone tags; runs after tests.
  deploy-pages:
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/milestone/')
    environment:
      name: pages
      url: https://${{ vars.CLOUDFLARE_PAGES_PROJECT || 'geoairquality-breathe' }}.pages.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build SPA
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Deploy to Cloudflare Pages
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'geoairquality-breathe' }}
          CLOUDFLARE_PAGES_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
        run: |
          npx wrangler pages deploy dist \
            --project-name="$CLOUDFLARE_PAGES_PROJECT" \
            --branch="$CLOUDFLARE_PAGES_ENV"
