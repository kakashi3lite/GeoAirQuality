# GeoAirQuality — GitLab CI/CD Pipeline
# ---------------------------------------------------------------------------
# Senior design goals:
#   1. Fast feedback: lint + unit tests run on every MR in < 3 minutes.
#   2. Correctness gates: integration tests run against REAL PostGIS + Redis
#      and apply `alembic upgrade head` (catches invalid migration SQL).
#   3. Supply-chain hygiene: images are built once, scanned, then published
#      by SHA — deploy uses the exact SHA that was tested.
#   4. Safe deploys: staging auto-deploys from main; production is a manual,
#      protected, approval-gated job.
#   5. Soft gates: legacy-code lint and security scans report but do not
#      block (debt tracked); new code lint is enforced.
# ---------------------------------------------------------------------------
# Required CI/CD variables (Settings → CI/CD → Variables):
#   CI_REGISTRY_USER / CI_REGISTRY_PASSWORD / CI_REGISTRY   (auto-provided)
#   KUBE_CONFIG_STAGING      base64 kubeconfig for staging cluster
#   KUBE_CONFIG_PRODUCTION   base64 kubeconfig for production cluster
#   STAGING_NAMESPACE        default: geoairquality-staging
#   PRODUCTION_NAMESPACE     default: geoairquality-prod
#   TRIVY_FAIL_ON_HIGH       "false" to report-only (recommended first week)
#
# Cloudflare Pages (frontend — "Breathe" SPA):
#   CLOUDFLARE_API_TOKEN      API token with Pages:Edit (and Account:Read)
#   CLOUDFLARE_ACCOUNT_ID     Cloudflare account ID
#   CLOUDFLARE_PAGES_PROJECT  Pages project name (default: geoairquality-breathe)
#   CLOUDFLARE_PAGES_ENV      "production" (default) or "preview"
# ---------------------------------------------------------------------------

stages:
  - lint
  - test
  - build
  - scan
  - publish
  - deploy

# ---------------------------------------------------------------------------
# Global defaults
# ---------------------------------------------------------------------------
default:
  image: python:3.11-slim
  timeout: 30m
  cache:
    key:
      files:
        - api/requirements.txt
        - data-pipeline/requirements.txt
    paths:
      - .cache/pip
  before_script:
    - python --version
    - pip install --upgrade pip -q
    - mkdir -p .cache/pip

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHON_VERSION: "3.11"
  # Docker-in-Docker (needs privileged runners — GitLab.com shared runners OK).
  DOCKER_HOST: "tcp://docker:2375"
  DOCKER_TLS_CERTDIR: ""
  # Integration services
  POSTGRES_DB: "geoairquality"
  POSTGRES_USER: "geoair_user"
  POSTGRES_PASSWORD: "geoair_pass"
  DATABASE_URL: "postgresql://geoair_user:geoair_pass@postgres:5432/geoairquality"
  REDIS_URL: "redis://redis:6379/0"
  RUN_INTEGRATION: "1"
  # Cloudflare Pages deploy
  CLOUDFLARE_PAGES_PROJECT: "geoairquality-breathe"
  CLOUDFLARE_PAGES_ENV: "production"

# ---------------------------------------------------------------------------
# Pipeline scope: MRs, main, tags, schedules
# ---------------------------------------------------------------------------
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG =~ /^milestone\//'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - when: never

# ===========================================================================
# LINT
# ===========================================================================
lint:enforced:
  stage: lint
  script:
    - pip install -q black flake8
    - make lint
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
  allow_failure: false

# Legacy code (main.py, models.py, cache.py, data-pipeline/) is not yet
# black/flake8 clean. Report but do not block — enforced after a formatting
# pass (see docs/guides/ci-cd.md → "Lint enforcement path").
lint:legacy:
  stage: lint
  script:
    - pip install -q black flake8
    - black --check api/main.py api/models.py api/cache.py data-pipeline/ || true
    - flake8 api/main.py api/models.py api/cache.py --max-line-length=100 || true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
  allow_failure: true

# ===========================================================================
# TEST
# ===========================================================================
test:unit:
  stage: test
  script:
    - pip install -q -r api/requirements.txt
    - pip install -q pytest-cov
    - make test
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: report.xml
    paths:
      - coverage.xml
      - report.xml
  coverage: '/TOTAL\s+\d+\s+\d+\s+(\d+)%/'
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG =~ /^milestone\//'

# Legacy Dask pipeline tests are KNOWN-FAILING (dask disabled in the
# project due to version incompatibility). Reported, not blocking.
test:legacy:
  stage: test
  script:
    - pip install -q -r api/requirements.txt
    - pip install -q -r data-pipeline/requirements.txt
    - make test-legacy
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# Real PostGIS + Redis: validates `alembic upgrade head` against a live
# server, the geography expression indexes, and the endpoint end-to-end.
test:integration:
  stage: test
  services:
    - name: postgis/postgis:15-3.3
      alias: postgres
    - name: redis:7-alpine
      alias: redis
  script:
    - pip install -q -r api/requirements.txt
    - cd api && alembic upgrade head
    - cd .. && make test-integration
  artifacts:
    when: always
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG =~ /^milestone\//'
  needs:
    - test:unit

# ===========================================================================
# BUILD  (images built once, by SHA, then scanned & published from the result)
# ===========================================================================
.build_template: &build_job
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_HOST: "tcp://docker:2375"
  retry: 1
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG =~ /^milestone\//'
  needs:
    - test:unit
    - test:integration

build:api:
  <<: *build_job
  script:
    - docker build -f api/Dockerfile -t "$CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHA" api/

build:pipeline:
  <<: *build_job
  script:
    - docker build -f data-pipeline/Dockerfile -t "$CI_REGISTRY_IMAGE/pipeline:$CI_COMMIT_SHA" data-pipeline/

# ===========================================================================
# SCAN  (soft gates — report vulnerabilities, don't block the release)
# ===========================================================================
# Secrets are BLOCKING: gitleaks scans full history on every MR and merge.
# Baseline verified clean (gitleaks v8.23.1, 18 commits, 0 leaks).
scan:secrets:
  stage: scan
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    GIT_DEPTH: "0"   # full history so gitleaks scans all commits
  script:
    - docker run --rm -v "$CI_PROJECT_DIR:/repo" -w /repo \
        gitleaks/gitleaks:latest detect --source /repo --no-banner --redact
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

scan:python:
  stage: scan
  script:
    - pip install -q bandit pip-audit
    - bandit -r api/ -f json -o bandit.json -q || true
    - pip-audit -r api/requirements.txt -r data-pipeline/requirements.txt || true
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - bandit.json
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

scan:container:
  stage: scan
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_HOST: "tcp://docker:2375"
  script:
    - apk add --no-cache curl
    - curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
    - trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed "$CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHA"
    - trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed "$CI_REGISTRY_IMAGE/pipeline:$CI_COMMIT_SHA"
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  needs:
    - build:api
    - build:pipeline

# ===========================================================================
# PUBLISH  (main + milestone tags only)
# ===========================================================================
publish:images:
  stage: publish
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_HOST: "tcp://docker:2375"
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - |
      for img in api pipeline; do
        docker push "$CI_REGISTRY_IMAGE/$img:$CI_COMMIT_SHA"
        docker tag "$CI_REGISTRY_IMAGE/$img:$CI_COMMIT_SHA" "$CI_REGISTRY_IMAGE/$img:latest"
        docker push "$CI_REGISTRY_IMAGE/$img:latest"
      done
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG =~ /^milestone\//'
  needs:
    - scan:container
    - build:api
    - build:pipeline

# ===========================================================================
# DEPLOY
# ===========================================================================
.deploy_base: &deploy_job
  stage: deploy
  image: bitnami/kubectl:latest
  before_script:
    - mkdir -p "$HOME/.kube"
    - echo "$KUBE_CONFIG" | base64 -d > "$HOME/.kube/config"
    - chmod 600 "$HOME/.kube/config"
    - kubectl version --client -o yaml | head -1

deploy:staging:
  <<: *deploy_job
  variables:
    KUBE_CONFIG: "$KUBE_CONFIG_STAGING"
    NAMESPACE: "$STAGING_NAMESPACE"
  environment:
    name: staging
    url: https://staging.geoairquality.com
  script:
    - kubectl set image deployment/geoairquality-api api="$CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHA" -n "$NAMESPACE"
    - kubectl set image deployment/geoairquality-pipeline pipeline="$CI_REGISTRY_IMAGE/pipeline:$CI_COMMIT_SHA" -n "$NAMESPACE"
    - kubectl rollout status deployment/geoairquality-api -n "$NAMESPACE" --timeout=240s
    - kubectl rollout status deployment/geoairquality-pipeline -n "$NAMESPACE" --timeout=240s
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  needs:
    - publish:images

# Production is MANUAL + approval-gated: a human triggers it from the
# pipeline UI on the protected `main` branch, and the environment's
# approval rules gate it further.
deploy:production:
  <<: *deploy_job
  variables:
    KUBE_CONFIG: "$KUBE_CONFIG_PRODUCTION"
    NAMESPACE: "$PRODUCTION_NAMESPACE"
  environment:
    name: production
    url: https://api.geoairquality.com
  script:
    - kubectl set image deployment/geoairquality-api api="$CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHA" -n "$NAMESPACE"
    - kubectl set image deployment/geoairquality-pipeline pipeline="$CI_REGISTRY_IMAGE/pipeline:$CI_COMMIT_SHA" -n "$NAMESPACE"
    - kubectl rollout status deployment/geoairquality-api -n "$NAMESPACE" --timeout=300s
    - kubectl rollout status deployment/geoairquality-pipeline -n "$NAMESPACE" --timeout=300s
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: false
  needs:
    - deploy:staging

# ===========================================================================
# CLOUDFLARE PAGES — "Breathe" frontend SPA
# ===========================================================================
# The SPA (frontend/) deploys to Cloudflare Pages: static assets + the
# functions/api/[[path]].js proxy that forwards /api/* to the API origin
# (env var API_ORIGIN, set in the Pages project). Security headers come
# from frontend/public/_headers; SPA fallback from frontend/public/_redirects.
#
# Staging: every push to main -> Pages preview branch deploy (project-level
# URL). Production: manual, after the API deploy, same project "production"
# environment (custom domain, e.g. app.geoairquality.com).
.pages_template: &pages_job
  stage: deploy
  image: node:20-alpine
  before_script: []
  variables:
    NODE_ENV: production
  script:
    - cd frontend
    - npm ci
    - npm run build
    - npx wrangler pages deploy dist \
        --project-name="$CLOUDFLARE_PAGES_PROJECT" \
        --branch="$CLOUDFLARE_PAGES_ENV"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG =~ /^milestone\//'
  needs:
    - test:unit

# Staging/preview deploy — automatic on main (project pages.dev URL).
deploy:pages:staging:
  <<: *pages_job
  variables:
    CLOUDFLARE_PAGES_ENV: "preview"
  environment:
    name: pages-staging
    url: https://$CLOUDFLARE_PAGES_PROJECT.pages.dev

# Production deploy — manual, after the API backend is live. Points the
# Pages "production" environment (custom domain) at this build.
deploy:pages:production:
  <<: *pages_job
  environment:
    name: pages-production
    url: https://app.geoairquality.com
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: false
  needs:
    - deploy:pages:staging
